<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DoggyCode Editor 🐕</title>

<style>
body {
  font-family: sans-serif;
}

#editor-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

#controls {
  margin-bottom: 10px;
}

#stage {
  width: 480px;
  height: 360px;
  background: white;
  outline: 3px solid #333;
  position: relative;
  overflow: hidden;
}

#dog {
  position: absolute;
  left: 0;
  top: 0;
}
</style>
</head>

<body>

src/flag.svg
src/stop.svg

<div id="editor-bar">
  <span>Code</span>
  <span>Costumes</span>
<div id="costumeelememt">
  <div id="costume-tools">
    <button data-tool="select">↖</button>
    <button data-tool="brush">✎</button>
    <button data-tool="line">╱</button>
    <button data-tool="rect">□</button>
    <button data-tool="circle">○</button>
    <button data-tool="erase">⌫</button>
    <button id="clear">🗑</button>
  </div>

  <canvas id="costume-canvas" width="480" height="360"></canvas>
</div>

<style>
#costumeelememt {
  display: flex;
  flex-direction: column;
  width: 480px;
}

#costume-tools {
  display: flex;
  gap: 4px;
  padding: 6px;
  background: #eee;
  border: 1px solid #ccc;
}

#costume-tools button {
  width: 38px;
  height: 34px;
  border: 1px solid #bbb;
  background: white;
  cursor: pointer;
  font-size: 18px;
}

#costume-tools button:hover {
  background: #ddd;
}

#costume-canvas {
  width: 480px;
  height: 360px;
  background: white;
  border: 2px solid #333;
  cursor: crosshair;
}
</style>

<script>
const canvas = document.getElementById("costume-canvas");
const ctx = canvas.getContext("2d");
let tool = "select";
let drawing = false;
let startX, startY;

document.querySelectorAll("[data-tool]").forEach(button => {
  button.onclick = () => tool = button.dataset.tool;
});

canvas.onpointerdown = e => {
  drawing = true;
  startX = e.offsetX;
  startY = e.offsetY;

  if (tool === "brush" || tool === "erase") {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
};

canvas.onpointermove = e => {
  if (!drawing) return;

  if (tool === "brush" || tool === "erase") {
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.strokeStyle = tool === "erase" ? "white" : "#222";
    ctx.lineWidth = tool === "erase" ? 20 : 4;
    ctx.stroke();
  }
};

canvas.onpointerup = e => {
  if (!drawing) return;
  drawing = false;

  const x = e.offsetX;
  const y = e.offsetY;

  ctx.strokeStyle = "#222";
  ctx.lineWidth = 4;

  if (tool === "line") {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  if (tool === "rect") {
    ctx.strokeRect(startX, startY, x - startX, y - startY);
  }

  if (tool === "circle") {
    const radius = Math.hypot(x - startX, y - startY);
    ctx.beginPath();
    ctx.arc(startX, startY, radius, 0, Math.PI * 2);
    ctx.stroke();
  }
};

document.getElementById("clear").onclick = () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
};
</script>
  <span>Sounds</span>
  <button id="visibility">👁️</button>
</div>

<div id="controls">
  <label>
    X:
    <input id="x" type="number" value="0">
  </label>

  <label>
    Y:
    <input id="y" type="number" value="0">
  </label>
</div>

<div id="stage">
  src/dog.svg
</div>

<script>
const dog = document.getElementById("dog");
const x = document.getElementById("x");
const y = document.getElementById("y");
const visibility = document.getElementById("visibility");

function moveDog() {
  dog.style.left = x.value + "px";
  dog.style.top = y.value + "px";
}

x.addEventListener("input", moveDog);
y.addEventListener("input", moveDog);

visibility.addEventListener("click", () => {
  const hidden = dog.style.display === "none";

  dog.style.display = hidden ? "" : "none";

  visibility.textContent = hidden
    ? "👁️"
    : "🕶️";
});
</script>

</body>
</html>
